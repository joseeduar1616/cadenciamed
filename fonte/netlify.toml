# Cadência Med · configuração do Netlify

[build]
  publish = "."

# Onde fica a função que conversa com o Claude.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O HTML nunca fica em cache, então publicar já aparece na hora.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Ícones mudam pouco, podem ficar guardados por uma semana.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# O leitor de banco do Anki quase não muda.
[[headers]]
  for = "/sql-asm.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
