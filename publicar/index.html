.text-right{text-align:right}
.w-full{width:100%}
.whitespace-nowrap{white-space:nowrap}
@media (min-width:640px){
html:not([data-layout="movel"]) .sm\:block{display:block}
html:not([data-layout="movel"]) .sm\:col-span-2{grid-column:span 2/span 2}
html:not([data-layout="movel"]) .sm\:flex{display:flex}
html:not([data-layout="movel"]) .sm\:flex-row{flex-direction:row}
html:not([data-layout="movel"]) .sm\:gap-2{gap:0.5rem}
html:not([data-layout="movel"]) .sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
html:not([data-layout="movel"]) .sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
html:not([data-layout="movel"]) .sm\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
html:not([data-layout="movel"]) .sm\:grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
html:not([data-layout="movel"]) .sm\:inline{display:inline}
html:not([data-layout="movel"]) .sm\:px-10{padding-left:2.5rem;padding-right:2.5rem}
html:not([data-layout="movel"]) .sm\:px-6{padding-left:1.5rem;padding-right:1.5rem}
html:not([data-layout="movel"]) .sm\:px-7{padding-left:1.75rem;padding-right:1.75rem}
html:not([data-layout="movel"]) .sm\:px-8{padding-left:2rem;padding-right:2rem}
html:not([data-layout="movel"]) .sm\:px-9{padding-left:2.25rem;padding-right:2.25rem}
}
@media (min-width:1024px){
html:not([data-layout="movel"]) .lg\:col-span-2{grid-column:span 2/span 2}
html:not([data-layout="movel"]) .lg\:col-span-3{grid-column:span 3/span 3}
html:not([data-layout="movel"]) .lg\:col-span-4{grid-column:span 4/span 4}
html:not([data-layout="movel"]) .lg\:flex-row{flex-direction:row}
html:not([data-layout="movel"]) .lg\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
html:not([data-layout="movel"]) .lg\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
html:not([data-layout="movel"]) .lg\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
html:not([data-layout="movel"]) .lg\:grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
html:not([data-layout="movel"]) .lg\:grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
}
